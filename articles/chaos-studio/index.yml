### YamlMime:Landing

title: Azure Chaos Studio documentation
summary: Chaos Studio Workspaces is the current resource model for organizing resilience testing and is in public preview. Use a Workspace to discover resources, run Scenarios, and review reports. Use Experiments (classic) when you need a generally available resource model or a classic-only fault or capability.

metadata:
