<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc">
<title id="title">Azure Monitor data collection topology by deployment scope</title>
<desc id="desc">Collection choices are organized by deployment scope and progressive operational value. Direct SDK or API ingestion provides source-level retry and export with no collector. Azure Monitor agent is nested inside individual hosts and adds guest OS and workload collection, filtering, buffering, and cost control. A containerized Azure Monitor agent also supports Kubernetes infrastructure collection for Container insights and Azure Monitor managed service for Prometheus. This is distinct from platform logs and metrics generated by Azure resources. Multiple agents and other supported producers fan into an off-box Azure Monitor pipeline, which adds processing, persistent buffering, and cost control. All current paths converge on Azure Monitor cloud ingestion, optional ingest-time transformations, and storage. Microsoft Sentinel uses a Sentinel-enabled Log Analytics workspace. Mirror Azure Monitor exposes the stored data to Microsoft Fabric without copying it. DCR configuration is separate from telemetry.</desc>
